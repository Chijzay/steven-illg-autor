<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }} · Steven Illg</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.31.0/dist/tabler-icons.min.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #fafaf8; --surface: #ffffff; --surface-hover: #f5f4f0;
      --border: #e5e3dc; --border-hover: #ccc9bf;
      --text: #1a1a18; --text-2: #5a5a54; --text-3: #9a9990;
      --radius: 12px; --radius-sm: 8px;
    }
    html { scroll-behavior: smooth; }
    body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--text); font-size: 16px; line-height: 1.7; min-height: 100vh; }
    a { color: inherit; text-decoration: none; }
    .wrap { max-width: 760px; margin: 0 auto; padding: 0 1.5rem; }

    .site-header { border-bottom: 1px solid var(--border); background: var(--surface); position: sticky; top: 0; z-index: 10; }
    .site-header .wrap { display: flex; align-items: center; justify-content: space-between; height: 56px; }
    .site-logo { font-family: 'Lora', Georgia, serif; font-size: 17px; font-weight: 500; color: var(--text); }
    .site-logo span { color: var(--text-3); font-weight: 400; }
    .header-link { font-size: 13px; color: var(--text-3); display: flex; align-items: center; gap: 5px; transition: color 0.15s; }
    .header-link:hover { color: var(--text-2); }

    .breadcrumb { padding: 1.25rem 0 0; }
    .breadcrumb a { font-size: 13px; color: var(--text-3); display: inline-flex; align-items: center; gap: 5px; transition: color 0.15s; }
    .breadcrumb a:hover { color: var(--text-2); }

    .page-header { padding: 2rem 0 1.5rem; }
    .page-header h1 { font-family: 'Lora', Georgia, serif; font-size: 1.75rem; font-weight: 600; line-height: 1.2; margin-bottom: 0.35rem; }
    .page-header p { font-size: 15px; color: var(--text-2); }

    .label { font-size: 11px; font-weight: 500; letter-spacing: 0.09em; text-transform: uppercase; color: var(--text-3); margin-bottom: 0.85rem; margin-top: 2rem; }
    .label:first-child { margin-top: 0; }

    hr { border: none; border-top: 1px solid var(--border); margin: 2rem 0; }

    /* Photo grid */
    .photo-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 0.5rem;
    }
    .photo-thumb {
      aspect-ratio: 1 / 1;
      border-radius: var(--radius-sm);
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      cursor: zoom-in;
      border: 1px solid var(--border);
      transition: box-shadow 0.15s, border-color 0.15s;
      -webkit-user-select: none;
      user-select: none;
      -webkit-user-drag: none;
    }
    .photo-thumb:hover {
      box-shadow: 0 4px 16px rgba(0,0,0,0.14);
      border-color: var(--border-hover);
    }

    /* Lightbox */
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.88);
      z-index: 100;
      align-items: center;
      justify-content: center;
      cursor: zoom-out;
    }
    .lightbox.open { display: flex; }
    .lightbox-img {
      max-width: min(92vw, 1100px);
      max-height: 90vh;
      border-radius: 10px;
      background-size: contain;
      background-position: center;
      background-repeat: no-repeat;
      -webkit-user-select: none;
      user-select: none;
      box-shadow: 0 32px 80px rgba(0,0,0,0.6);
    }
    .lightbox-close {
      position: fixed;
      top: 1.25rem;
      right: 1.5rem;
      color: rgba(255,255,255,0.7);
      font-size: 28px;
      cursor: pointer;
      line-height: 1;
      transition: color 0.15s;
    }
    .lightbox-close:hover { color: #fff; }

    .site-footer { border-top: 1px solid var(--border); padding: 1.5rem 0; margin-top: 3rem; }
    .site-footer .wrap { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 0.5rem; }
    .site-footer p { font-size: 12px; color: var(--text-3); }
    .footer-links { display: flex; gap: 1.25rem; }
    .footer-links a { font-size: 12px; color: var(--text-3); display: flex; align-items: center; gap: 4px; transition: color 0.15s; }
    .footer-links a:hover { color: var(--text-2); }

    @media (max-width: 520px) {
      .photo-grid { grid-template-columns: repeat(2, 1fr); gap: 6px; }
    }
  </style>
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a href="{{ site.baseurl }}/" class="site-logo">Steven Illg <span>· Portfolio</span></a>
    <a href="https://github.com/Chijzay" class="header-link" target="_blank" rel="noopener">
      <i class="ti ti-brand-github"></i> GitHub
    </a>
  </div>
</header>

<main>
  <div class="wrap">
    <nav class="breadcrumb">
      <a href="{{ site.baseurl }}/"><i class="ti ti-arrow-left"></i> Portfolio</a>
    </nav>

    <div class="page-header">
      <h1>{{ page.title }}</h1>
      {% if page.description %}<p>{{ page.description }}</p>{% endif %}
    </div>

    <hr style="margin-top:0;">

    <p class="label">Natur &amp; Tiere</p>
    <div class="photo-grid">
      <div class="photo-thumb"
           style="background-image:url('{{ site.baseurl }}/fotografie/IMG_10392.JPG')"
           onclick="openLightbox('{{ site.baseurl }}/fotografie/IMG_10392.JPG')"
           oncontextmenu="return false" title="Kohlmeise"></div>
      <div class="photo-thumb"
           style="background-image:url('{{ site.baseurl }}/fotografie/IMG_1457.JPG')"
           onclick="openLightbox('{{ site.baseurl }}/fotografie/IMG_1457.JPG')"
           oncontextmenu="return false" title="Möwe"></div>
      <div class="photo-thumb"
           style="background-image:url('{{ site.baseurl }}/fotografie/IMG_1567.JPG')"
           onclick="openLightbox('{{ site.baseurl }}/fotografie/IMG_1567.JPG')"
           oncontextmenu="return false" title="Pusteblume"></div>
      <div class="photo-thumb"
           style="background-image:url('{{ site.baseurl }}/fotografie/IMG_1572.JPG')"
           onclick="openLightbox('{{ site.baseurl }}/fotografie/IMG_1572.JPG')"
           oncontextmenu="return false" title="Spinne im Netz"></div>
    </div>

    <p class="label">Hamburg &amp; Hafen</p>
    <div class="photo-grid">
      <div class="photo-thumb"
           style="background-image:url('{{ site.baseurl }}/fotografie/IMG_1804.JPG')"
           onclick="openLightbox('{{ site.baseurl }}/fotografie/IMG_1804.JPG')"
           oncontextmenu="return false" title="Containerkräne bei Sonnenuntergang"></div>
      <div class="photo-thumb"
           style="background-image:url('{{ site.baseurl }}/fotografie/IMG_1848.JPG')"
           onclick="openLightbox('{{ site.baseurl }}/fotografie/IMG_1848.JPG')"
           oncontextmenu="return false" title="Elbphilharmonie"></div>
      <div class="photo-thumb"
           style="background-image:url('{{ site.baseurl }}/fotografie/IMG_1890.JPG')"
           onclick="openLightbox('{{ site.baseurl }}/fotografie/IMG_1890.JPG')"
           oncontextmenu="return false" title="Hamburger Hafen"></div>
    </div>

  </div>
</main>

<footer class="site-footer">
  <div class="wrap">
    <p>© 2004–2026 Steven Illg · Alle Rechte vorbehalten</p>
    <div class="footer-links">
      <a href="{{ site.baseurl }}/LICENSE" target="_blank" rel="noopener"><i class="ti ti-file-description"></i> Lizenz</a>
      <a href="https://github.com/Chijzay/steven-illg-autor" target="_blank" rel="noopener"><i class="ti ti-brand-github"></i> Repository</a>
    </div>
  </div>
</footer>

<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <span class="lightbox-close" onclick="closeLightbox()">&times;</span>
  <div class="lightbox-img" id="lightbox-img" oncontextmenu="return false"></div>
</div>

<script>
function openLightbox(url) {
  var img = document.getElementById('lightbox-img');
  img.style.backgroundImage = "url('" + url + "')";
  var isPortrait = url.indexOf('IMG_1848') !== -1 || url.indexOf('IMG_1890') !== -1;
  if (isPortrait) {
    img.style.width = 'min(55vw, 600px)';
    img.style.height = '90vh';
  } else {
    img.style.width = 'min(92vw, 1100px)';
    img.style.height = 'min(80vh, 700px)';
  }
  document.getElementById('lightbox').classList.add('open');
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
}
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') closeLightbox();
});
</script>

</body>
</html>
